name: Build and release binaries

on:
  push:
    branches:
      - master

jobs:
  # Each platform builds and tests itself, then hands its binary over as an
  # artifact. Nothing publishes from here: the release is recreated on every
  # run, so parallel jobs attaching assets directly would delete each
  # other's. Publishing happens once, in the job below.
  build:
    strategy:
      # One platform failing shouldn't discard the others' binaries — the
      # publish job still gets whatever succeeded, and the failure is
      # visible on its own.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: cliwavx.exe
            built: target/release/cliwavx.exe
          # Apple Silicon only. Intel Macs are deliberately not shipped: the
          # macos-13 runners queue for a long time and hold up every release,
          # and Rosetta does not help here — it translates x86_64 to arm64,
          # not the reverse, so an Intel Mac needs its own build. Intel users
          # are pointed at building from source by docs/install.sh.
          - os: macos-latest
            asset: cliwavx-macos-arm64
            built: target/release/cliwavx

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Stage binary under its release name
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.built }}" "dist/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every platform's binary
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach them all to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          prerelease: false
          files: dist/*
